<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#216e42"><title>Control de Consumo de Cerdos</title><style>body{font-family:system-ui;margin:0;background:#f3f6f3;color:#183023}header{background:#216e42;color:white;padding:20px}main{max-width:700px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 1px 6px #ddd}label{display:block;margin:12px 0 4px}input,textarea,button,select{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #aeb9b0;border-radius:8px}button{background:#216e42;color:white;border:0;margin-top:12px;font-weight:bold}button.alt{background:#53645a}button.danger{background:#9d3030}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.item{border-top:1px solid #ddd;padding:12px 0}small{color:#526157}h2{margin-top:0}</style></head><body><header><h1>🐷 Control de Consumo de Cerdos</h1><div>Registro de alimento y gastos</div></header><main><section><h2>Inventario de cerdos</h2><label>Cantidad de cerdos (opcional)</label><input id="pigs" type="number" min="0" placeholder="Puedes completarlo después"><button onclick="savePigs()">Guardar inventario</button></section><section><h2 id="formTitle">Agregar consumo</h2><form id="form"><label>Fecha</label><input id="date" type="date" required><label>Bultos de 40 kg</label><input id="bags" type="number" min="0.01" step="any" required><label>Precio por bulto (COP)</label><input id="price" type="number" min="0" step="any" required><label>Descripción escrita por ti</label><textarea id="desc" rows="3" placeholder="Ej. Se llevaron alimento para el corral"></textarea><button type="submit">Guardar registro</button><button type="button" class="alt" onclick="resetForm()">Cancelar edición</button></form></section><section><h2>Resumen mensual</h2><label>Seleccionar mes</label><input type="month" id="month" onchange="render()"><p id="summary"></p></section><section><h2>Historial</h2><div id="history"></div></section><section><h2>Copias de seguridad</h2><p><small>Los datos se guardan en este navegador. Si borras los datos del navegador o cambias de celular, podrían perderse. Descarga una copia regularmente.</small></p><button onclick="backup()">Descargar copia de seguridad</button><label>Restaurar copia de seguridad (JSON)</label><input type="file" id="restore" accept=".json,application/json" onchange="restoreData(event)"></section></main><script>
const KEY='consumo_cerdos_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{pigs:'',entries:[]}}catch{data={pigs:'',entries:[]}}let editing=null;
const el=id=>document.getElementById(id);const today=new Date();const localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);el('date').value=localDate;el('month').value=localDate.slice(0,7);el('pigs').value=data.pigs??'';
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function savePigs(){const v=el('pigs').value;if(v!==''&&(!Number.isInteger(+v)||+v<0))return alert('Ingresa una cantidad válida');data.pigs=v;persist();alert('Inventario guardado')}
function resetForm(){editing=null;el('form').reset();el('date').value=localDate;el('formTitle').textContent='Agregar consumo'}
el('form').addEventListener('submit',e=>{e.preventDefault();let bags=+el('bags').value,price=+el('price').value;if(!(bags>0)||price<0||!Number.isFinite(price))return alert('Revisa bultos y precio');let entry={id:editing||String(Date.now())+Math.random(),date:el('date').value,bags,price,desc:el('desc').value};if(editing){data.entries=data.entries.map(x=>x.id===editing?entry:x)}else data.entries.push(entry);persist();resetForm()});
function edit(id){let x=data.entries.find(x=>x.id===id);if(!x)return;editing=id;el('date').value=x.date;el('bags').value=x.bags;el('price').value=x.price;el('desc').value=x.desc;el('formTitle').textContent='Editar registro';scrollTo({top:0,behavior:'smooth'})}
function removeEntry(id){if(confirm('¿Eliminar este registro?')){data.entries=data.entries.filter(x=>x.id!==id);persist()}}
const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
function render(){let month=el('month').value;let entries=data.entries.filter(x=>x.date.startsWith(month));let bags=entries.reduce((a,x)=>a+x.bags,0),cost=entries.reduce((a,x)=>a+x.bags*x.price,0);el('summary').textContent=`${entries.length} registros · ${bags} bultos · ${bags*40} kg · ${cop(cost)}${+data.pigs>0?' · '+(bags*40/+data.pigs).toFixed(2)+' kg por cerdo en el mes (promedio simple)':''}`;let list=el('history');list.replaceChildren();for(let x of [...data.entries].sort((a,b)=>b.date.localeCompare(a.date))){let box=document.createElement('div');box.className='item';let txt=document.createElement('p');txt.textContent=`${x.date} · ${x.bags} bultos (${x.bags*40} kg) · ${cop(x.bags*x.price)} · ${x.desc||'Sin descripción'}`;box.append(txt);let row=document.createElement('div');row.className='row';let a=document.createElement('button');a.textContent='Editar';a.onclick=()=>edit(x.id);let b=document.createElement('button');b.className='danger';b.textContent='Borrar';b.onclick=()=>removeEntry(x.id);row.append(a,b);box.append(row);list.append(box)}if(!data.entries.length)list.textContent='Aún no hay registros.'}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='respaldo-cerdos-'+localDate+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreData(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.entries)||!d.entries.every(x=>typeof x.date==='string'&&Number.isFinite(x.bags)&&Number.isFinite(x.price)))throw Error();if(confirm('¿Reemplazar los datos actuales por los de la copia?')){data={pigs:d.pigs??'',entries:d.entries};el('pigs').value=data.pigs;persist()}}catch{alert('El archivo no es una copia válida')}e.target.value=''}
render();
</script></body></html>
